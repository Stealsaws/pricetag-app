<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIKIRIKI ป้ายราคา - ระบบพิมพ์ป้าย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ===================== TOP BAR (hidden on print) ===================== -->
  <header class="topbar no-print">
    <div class="topbar-brand">
      <span class="brand-riki">Riki<br>Riki</span>
      <div>
        <h1>ระบบพิมพ์ป้ายราคา</h1>
        <p>เลือกเทมเพลต กรอกข้อมูล แล้วสั่งพิมพ์ได้ทันที</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btnShowQueue" class="btn btn-ghost btn-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"></rect><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"></path><path d="M10 12h4"></path></svg>
        คิวพิมพ์ <span id="queueCount" class="badge">0</span>
      </button>
    </div>
  </header>

  <!-- ===================== MOBILE TABS ===================== -->
  <div class="mobile-tabs no-print">
    <button class="mobile-tab active" data-tab="edit">แก้ไขข้อมูล</button>
    <button class="mobile-tab" data-tab="preview">ดูตัวอย่าง</button>
  </div>

  <!-- ===================== MAIN LAYOUT ===================== -->
  <main class="layout no-print">

    <!-- LEFT: template picker + form -->
    <section class="panel panel-controls" data-pane="edit">

      <div class="control-block">
        <h2><span class="step-badge">1</span>เลือกประเภทป้าย</h2>
        <div id="categoryPicker" class="category-grid"></div>
      </div>

      <div class="control-block">
        <h2><span class="step-badge">2</span>เลือกขนาด</h2>
        <div id="sizePicker" class="size-grid"></div>
      </div>

      <div class="control-block" id="formBlock">
        <h2><span class="step-badge">3</span>กรอกรายละเอียดสินค้า</h2>
        <form id="signForm" class="sign-form"></form>
      </div>

    </section>

    <!-- RIGHT: live preview -->
    <section class="panel panel-preview" data-pane="preview">
      <h2>ตัวอย่างป้าย <span id="previewMeta" class="preview-meta"></span></h2>
      <div id="previewStageOuter" class="stage-outer">
        <div id="previewStage" class="stage-scaler"></div>
      </div>
      <p id="approxNotice" class="approx-notice" hidden>
        * เทมเพลตขนาดนี้คำนวณตำแหน่งจากสัดส่วนของขนาด A4 นอน อาจต้องปรับตำแหน่งเล็กน้อยหลังตรวจดูจริง
      </p>
    </section>

  </main>

  <!-- ===================== STICKY ACTION BAR ===================== -->
  <div class="action-bar no-print">
    <button id="btnAddQueue" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
      เพิ่มลงคิวพิมพ์
    </button>
    <button id="btnPrintNow" class="btn btn-outline">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
      พิมพ์ป้ายนี้ทันที
    </button>
  </div>

  <!-- ===================== QUEUE DRAWER (hidden on print) ===================== -->
  <div id="queueDrawer" class="drawer no-print" hidden>
    <div class="drawer-head">
      <h2>คิวพิมพ์ (<span id="queueCount2">0</span> ใบ)</h2>
      <button id="btnCloseQueue" class="btn btn-ghost btn-icon-only" aria-label="ปิด">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </button>
    </div>
    <div id="queueList" class="queue-list"></div>
    <div class="drawer-actions">
      <button id="btnClearQueue" class="btn btn-ghost">ล้างคิวทั้งหมด</button>
      <button id="btnPrintQueue" class="btn btn-primary">พิมพ์ทั้งหมด</button>
    </div>
  </div>

  <!-- ===================== TOAST ===================== -->
  <div id="toast" class="toast no-print" hidden></div>

  <!-- ===================== PRINT AREA (only this prints) ===================== -->
  <div id="printArea" class="print-only"></div>

</div>

<script src="js/app.js"></script>
</body>
</html>
